<!-- EXERCISE_HERO_START -->

<section class="fvd-exercise-hero">

    <div class="fvd-exercise-hero__grid"></div>
    <div class="fvd-exercise-hero__curve"></div>
  
    <div class="fvd-exercise-hero__content">
  
      <div class="fvd-exercise-hero__theme">
        <span class="fvd-exercise-hero__theme-number">
          THEMA {{THEME_NUMBER}}
        </span>
  
        <span class="fvd-exercise-hero__theme-dot">•</span>
  
        <span class="fvd-exercise-hero__theme-title">
          {{THEME}}
        </span>
      </div>
  
  
      <div class="fvd-exercise-hero__label">
        <span class="fvd-exercise-hero__label-icon">✎</span>
        <span>OEFENINGEN</span>
      </div>
  
  
      <div class="fvd-exercise-hero__main">
  
        <div class="fvd-exercise-hero__number">
          {{CHAPTER_NUMBER}}
        </div>
  
        <h1 class="fvd-exercise-hero__title">
          {{TITLE}}
        </h1>
  
      </div>
  
  
      <div class="fvd-exercise-hero__accent"></div>
  
    </div>
  
  </section>
  
  <!-- EXERCISE_HERO_END -->
