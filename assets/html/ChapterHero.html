<section class="chapter-hero">

    <div class="chapter-hero__decoration" aria-hidden="true">
        <span class="chapter-hero__formula">
            f(x) = ax² + bx + c
        </span>

        <span class="chapter-hero__curve"></span>
        <span class="chapter-hero__grid"></span>
    </div>

    <div class="chapter-hero__content">

        <div class="chapter-hero__theme">
            <span class="chapter-hero__theme-label">
                Thema {{THEME_NUMBER}}
            </span>

            <span class="chapter-hero__theme-dot"></span>

            <span class="chapter-hero__theme-name">
                {{THEME}}
            </span>
        </div>

        <div class="chapter-hero__chapter-label">
            Hoofdstuk
        </div>

        <div class="chapter-hero__main">

            <div class="chapter-hero__number">
                {{CHAPTER_LOCAL_NUMBER}}
            </div>

            <div class="chapter-hero__text">
                <h1 class="chapter-hero__title">
                    {{TITLE}}
                </h1>

                <p class="chapter-hero__abstract">
                    {{ABSTRACT}}
                </p>
            </div>

        </div>

        <div class="chapter-hero__accent"></div>

    </div>

</section>
