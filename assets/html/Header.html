     <header class="fvd-hero" aria-labelledby="fvd-hero-title">
        <div class="fvd-hero__grid" aria-hidden="true"></div>
        <div class="fvd-hero__glow fvd-hero__glow--left" aria-hidden="true"></div>
        <div class="fvd-hero__glow fvd-hero__glow--right" aria-hidden="true"></div>
    
        <div class="fvd-hero__inner">
    
            <!-- Groot Athena-logo links -->
            <div class="fvd-hero__brand">
                <img
                    class="fvd-hero__logo"
                    src="/images/banners/logo_athena.png"
                    alt="Athena secundair onderwijs"
                >
            </div>
    
            <div class="fvd-hero__divider" aria-hidden="true"></div>
    
            <!-- Centrale titel en leerinhouden -->
            <div class="fvd-hero__content">
                <p class="fvd-hero__eyebrow">
                    Fundamentele Vorming Digitale Creatie
                </p>
    
                <h1 id="fvd-hero-title" class="fvd-hero__title">
                    <span class="fvd-hero__title-main">Wiskunde</span>
                    <span class="fvd-hero__title-accent">7 FVD</span>
                </h1>
    
                <div class="fvd-hero__pink-line" aria-hidden="true"></div>
    
                <p class="fvd-hero__subtitle">
                    Wiskundige inzichten die je nodig hebt om digitale werelden te bouwen.
                </p>
    
                <div class="fvd-hero__chips" aria-label="Onderwerpen in deze cursus">
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                            <path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"></path>
                        </svg>
                        Basiswiskunde
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 17c4-1 4-10 8-10 2 0 2 3 4 3 1 0 2-.4 4-2"></path>
                            <path d="M7 20 13 4"></path>
                        </svg>
                        Algebra
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 8h14M5 16h14"></path>
                        </svg>
                        Vergelijkingen
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 19V5M4 19h16"></path>
                            <path d="m7 16 4-5 3 2 4-6"></path>
                        </svg>
                        Functies
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 18 18 5"></path>
                            <path d="M12 5h6v6"></path>
                        </svg>
                        Vectoren
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="7"></circle>
                            <path d="M12 2v20M2 12h20"></path>
                        </svg>
                        Coördinaten
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"></path>
                            <path d="m4 7.5 8 4.5 8-4.5M12 12v9"></path>
                        </svg>
                        3D-meetkunde
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 16c3-8 7-8 10 0 2 5 5 4 8-4"></path>
                        </svg>
                        Goniometrie
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 18V6M5 18h14"></path>
                            <path d="M8 16c1-6 3-9 8-10"></path>
                        </svg>
                        Logaritmen
                    </span>
    
                    <span class="fvd-chip">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m7 6 10 5-10 5z"></path>
                            <path d="m7 10 10 5-10 5"></path>
                        </svg>
                        Transformaties
                    </span>
    
                </div>
            </div>
    
            <!-- Rechterzijde met wiskundige SVG-tekeningen -->
            <div class="fvd-hero__visual" aria-hidden="true">
    
                <!-- 3D-kubus -->
                <svg class="fvd-visual fvd-visual--cube" viewBox="0 0 310 245">
                    <g class="fvd-svg-cyan">
                        <path d="M65 72 185 86 245 48 125 34Z"></path>
                        <path d="M65 72v110l120 16V86"></path>
                        <path d="M185 86 245 48v110l-60 40"></path>
                        <path class="fvd-svg-dash" d="M125 34v110M125 144 65 182M125 144l120 14"></path>
                        <path d="M125 144 90 210M125 144l88 28M125 144V15"></path>
                        <path d="m90 210 11-4-7-9M213 172l-9-7-2 11M125 15l-6 11h12"></path>
                    </g>
                    <g class="fvd-svg-label">
                        <text x="82" y="225">x</text>
                        <text x="220" y="180">y</text>
                        <text x="132" y="18">z</text>
                    </g>
                </svg>
    
                <!-- Matrix -->
                <svg class="fvd-visual fvd-visual--matrix" viewBox="0 0 220 100">
                    <g class="fvd-svg-soft">
                        <text x="0" y="58">A =</text>
                        <path d="M60 10c-12 18-12 62 0 80M205 10c12 18 12 62 0 80"></path>
                        <text x="82" y="36">1</text>
                        <text x="123" y="36">2</text>
                        <text x="165" y="36">0</text>
                        <text x="73" y="61">−1</text>
                        <text x="123" y="61">0</text>
                        <text x="165" y="61">3</text>
                        <text x="82" y="86">2</text>
                        <text x="113" y="86">−2</text>
                        <text x="165" y="86">1</text>
                    </g>
                </svg>
    
                <!-- Vectoren en rotatie -->
                <svg class="fvd-visual fvd-visual--vectors" viewBox="0 0 260 170">
                    <g class="fvd-svg-cyan">
                        <path d="M55 138 132 74"></path>
                        <path d="m132 74-13 3 8 10"></path>
                        <path d="M55 138h125"></path>
                        <path d="m180 138-12-6v12"></path>
                        <path class="fvd-svg-dash" d="M55 138c24-65 116-95 156-25"></path>
                    </g>
                    <g class="fvd-svg-pink">
                        <path d="M55 138 207 104"></path>
                        <path d="m207 104-13-2 5 12"></path>
                        <path class="fvd-svg-dash" d="M211 113c17-13 25-5 21 11"></path>
                        <path d="m232 124-9-8-2 12"></path>
                    </g>
                    <g class="fvd-svg-label">
                        <text x="38" y="153">O</text>
                        <text x="138" y="73">u⃗</text>
                        <text x="188" y="98">v⃗</text>
                        <text x="141" y="130">x⃗</text>
                        <text x="222" y="102">Rθ</text>
                    </g>
                </svg>
    
                <!-- Bézier-curve -->
                <svg class="fvd-visual fvd-visual--bezier" viewBox="0 0 280 110">
                    <g class="fvd-svg-soft">
                        <path d="M30 82 85 30 190 30 245 82"></path>
                    </g>
                    <g class="fvd-svg-cyan">
                        <path d="M30 82c42-12 55-52 105-52s67 40 110 52"></path>
                    </g>
                    <g class="fvd-svg-pink">
                        <circle cx="30" cy="82" r="4"></circle>
                        <circle cx="85" cy="30" r="4"></circle>
                        <circle cx="190" cy="30" r="4"></circle>
                        <circle cx="245" cy="82" r="4"></circle>
                    </g>
                    <g class="fvd-svg-label">
                        <text x="18" y="102">P₀</text>
                        <text x="74" y="20">P₁</text>
                        <text x="181" y="20">P₂</text>
                        <text x="238" y="102">P₃</text>
                        <text x="103" y="79">Bézier-curve</text>
                    </g>
                </svg>
    
            </div>
    
        </div>
    
        <div class="fvd-hero__pink-corner" aria-hidden="true"></div>
    </header>
