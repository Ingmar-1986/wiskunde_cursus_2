<article class="course-card">

    <a href="{{URL}}" class="course-card-link">

        <div class="course-card-header">

            <span class="course-card-number">
                {{NUMBER}}
            </span>

            <span class="course-card-theme">
                {{THEME}}
            </span>

        </div>

        <h3 class="course-card-title">
            {{TITLE}}
        </h3>

        <p class="course-card-abstract">
            {{ABSTRACT}}
        </p>

        <div class="course-card-footer">

            <span class="course-card-button">
                Hoofdstuk openen →
            </span>

        </div>

    </a>

</article>
