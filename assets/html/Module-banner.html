<section class="fvd-module-banner">
    <div class="fvd-module-banner__glow fvd-module-banner__glow--left"></div>
    <div class="fvd-module-banner__glow fvd-module-banner__glow--right"></div>
  
    <div class="fvd-module-banner__grid"></div>
  
    <div class="fvd-module-banner__icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" role="img">
        <rect x="13" y="7" width="38" height="50" rx="8"></rect>
        <rect x="19" y="14" width="26" height="10" rx="2"></rect>
  
        <circle cx="22" cy="33" r="2.5"></circle>
        <circle cx="32" cy="33" r="2.5"></circle>
        <circle cx="42" cy="33" r="2.5"></circle>
  
        <circle cx="22" cy="42" r="2.5"></circle>
        <circle cx="32" cy="42" r="2.5"></circle>
        <circle cx="42" cy="42" r="2.5"></circle>
  
        <circle cx="22" cy="51" r="2.5"></circle>
        <circle cx="32" cy="51" r="2.5"></circle>
        <circle cx="42" cy="51" r="2.5"></circle>
      </svg>
    </div>
  
    <div class="fvd-module-banner__content">
      <div class="fvd-module-banner__label">
        Module {{MODULE_NUMBER}}
      </div>
  
      <h1 class="fvd-module-banner__title">
        {{MODULE_TITLE}}
      </h1>
  
      <p class="fvd-module-banner__description">
        {{MODULE_DESCRIPTION}}
      </p>
  
      <div class="fvd-module-banner__meta">
        <div class="fvd-module-banner__meta-item">
          <span class="fvd-module-banner__meta-icon">◷</span>
          <span>{{LESSON_HOURS}} lesuren</span>
        </div>
  
        <div class="fvd-module-banner__divider"></div>
  
        <div class="fvd-module-banner__meta-item">
          <span class="fvd-module-banner__meta-icon">▤</span>
          <span>{{THEME_COUNT}} thema's</span>
        </div>
  
        <div class="fvd-module-banner__divider"></div>
  
        <div class="fvd-module-banner__meta-item">
          <span class="fvd-module-banner__meta-icon">▶</span>
          <span>Start hier</span>
        </div>
      </div>
    </div>
  
    <div class="fvd-module-banner__visual" aria-hidden="true">
      <div class="fvd-module-banner__symbols">
        <span>+</span>
        <span>−</span>
        <span>×</span>
        <span>÷</span>
      </div>
  
      <svg class="fvd-module-banner__graph" viewBox="0 0 360 180">
        <line x1="35" y1="142" x2="335" y2="142"></line>
        <line x1="92" y1="160" x2="92" y2="20"></line>
  
        <path
          d="M45 140
             C80 140, 80 72, 125 72
             C170 72, 165 118, 205 118
             C245 118, 235 40, 280 40
             C315 40, 316 94, 335 98">
        </path>
      </svg>
    </div>
  </section>
