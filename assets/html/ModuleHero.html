<section class="module-hero">

    <div class="module-hero-content">

        <span class="module-label">
            Module
        </span>

        <h1 class="module-title">
            {{MODULE_TITLE}}
        </h1>

        <p class="module-description">
            {{MODULE_DESCRIPTION}}
        </p>

        <div class="module-meta">

            <div class="module-meta-item">
                <span class="meta-value">{{CHAPTER_COUNT}}</span>
                <span class="meta-label">Hoofdstukken</span>
            </div>

            <div class="module-meta-item">
                <span class="meta-value">{{STUDY_TIME}}</span>
                <span class="meta-label">Studietijd</span>
            </div>

            <div class="module-meta-item">
                <span class="meta-value">{{LEVEL}}</span>
                <span class="meta-label">Niveau</span>
            </div>

        </div>

        <div class="module-actions">

            <a class="module-button module-button-primary"
               href="{{FIRST_CHAPTER}}">
                Start de cursus
            </a>

        </div>

    </div>

    <div class="module-hero-visual">

        <img
            src="../../modules/images/banners/hero_math_visual.svg"
            alt=""
        >

    </div>

</section>
