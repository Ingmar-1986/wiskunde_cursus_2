<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Digitale wiskundevisual voor Wiskunde 7 FVD</title>
  <desc id="desc">Een transparante vectorillustratie met Béziercurve, 3D-assenstelsel, kubus, polygon mesh, vectorpijl, cirkelconstructie en subtiele formules in cyaan en magenta.</desc>
  <defs>
    <linearGradient id="cyanMagenta" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#35e6ef"/><stop offset="55%" stop-color="#7a8cff"/><stop offset="100%" stop-color="#ff2f92"/></linearGradient>
    <radialGradient id="glowCyan"><stop offset="0%" stop-color="#56f3ee" stop-opacity=".95"/><stop offset="42%" stop-color="#2bd7df" stop-opacity=".32"/><stop offset="100%" stop-color="#2bd7df" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink"><stop offset="0%" stop-color="#ff4da0" stop-opacity=".9"/><stop offset="45%" stop-color="#ff2f92" stop-opacity=".28"/><stop offset="100%" stop-color="#ff2f92" stop-opacity="0"/></radialGradient>
    <filter id="neonCyan" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="neonPink" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42eaf0"/></marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9bf7ef"/></marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#39dfe5" stroke-opacity=".12" stroke-width="1"/></pattern>
    <style>
      .thin{fill:none;stroke:#4be8ed;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.faint{fill:none;stroke:#4be8ed;stroke-opacity:.24;stroke-width:1.5}.mesh{fill:none;stroke:#47e6ec;stroke-width:1.4;stroke-opacity:.82}.label{fill:#aef9f4;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px}.formula{fill:#9bf7ef;font-family:Georgia,Times New Roman,serif;font-style:italic;font-size:30px}.small{fill:#75e9eb;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;letter-spacing:.08em}
    </style>
  </defs>
  <circle cx="715" cy="205" r="205" fill="url(#glowCyan)" opacity=".18"/>
  <circle cx="1025" cy="500" r="150" fill="url(#glowPink)" opacity=".11"/>
  <g opacity=".65"><path d="M300 640H1120L930 380H470Z" fill="url(#grid)" opacity=".75"/><path d="M300 640H1120L930 380H470Z" fill="none" stroke="#42e4e9" stroke-opacity=".18" stroke-width="1.5"/><g stroke="#42e4e9" stroke-opacity=".13"><line x1="420" y1="640" x2="540" y2="380"/><line x1="540" y1="640" x2="610" y2="380"/><line x1="660" y1="640" x2="680" y2="380"/><line x1="780" y1="640" x2="750" y2="380"/><line x1="900" y1="640" x2="820" y2="380"/><line x1="1020" y1="640" x2="890" y2="380"/></g></g>
  <circle cx="720" cy="225" r="180" class="faint"/><circle cx="720" cy="225" r="230" class="faint" opacity=".42"/><circle cx="720" cy="225" r="7" fill="#39e2e6" filter="url(#neonCyan)"/>
  <g><line x1="535" y1="255" x2="665" y2="75" stroke="#4be8ed" stroke-opacity=".65" stroke-width="1.5"/><line x1="665" y1="75" x2="845" y2="120" stroke="#8d8fff" stroke-opacity=".62" stroke-width="1.5"/><line x1="845" y1="120" x2="930" y2="265" stroke="#ff4b9c" stroke-opacity=".62" stroke-width="1.5"/><path d="M535 255C665 75 845 120 930 265" fill="none" stroke="url(#cyanMagenta)" stroke-width="6" stroke-linecap="round" filter="url(#neonCyan)"/><g fill="#07141f" stroke-width="4"><circle cx="535" cy="255" r="9" stroke="#35e6ef"/><circle cx="665" cy="75" r="8" stroke="#35e6ef"/><circle cx="845" cy="120" r="8" stroke="#a58fff"/><circle cx="930" cy="265" r="9" stroke="#ff2f92"/></g><text x="650" y="285" class="small">BÉZIER CURVE</text></g>
  <g><line x1="865" y1="310" x2="1100" y2="135" stroke="#42eaf0" stroke-width="3.5" marker-end="url(#arrowCyan)" filter="url(#neonCyan)"/><circle cx="865" cy="310" r="5" fill="#9bf7ef"/><text x="965" y="125" class="formula">v⃗ = (x, y, z)</text></g>
  <g stroke="#8cf8f3" stroke-width="3" fill="none"><line x1="705" y1="500" x2="705" y2="340" marker-end="url(#arrowSoft)"/><line x1="705" y1="500" x2="875" y2="555" marker-end="url(#arrowSoft)"/><line x1="705" y1="500" x2="585" y2="575" marker-end="url(#arrowSoft)"/></g><g class="label"><text x="688" y="329">z</text><text x="885" y="566">y</text><text x="555" y="598">x</text><text x="688" y="525">0</text></g>
  <g class="thin"><rect x="760" y="405" width="125" height="125"/><rect x="800" y="370" width="125" height="125"/><line x1="760" y1="405" x2="800" y2="370"/><line x1="885" y1="405" x2="925" y2="370"/><line x1="885" y1="530" x2="925" y2="495"/><line x1="760" y1="530" x2="800" y2="495"/><line x1="800" y1="370" x2="800" y2="495"/><line x1="925" y1="370" x2="925" y2="495"/></g>
  <g class="mesh"><polygon points="970,520 1035,390 1125,520"/><polygon points="970,520 1040,470 1125,520"/><polygon points="1035,390 1040,470 970,520"/><polygon points="1035,390 1040,470 1125,520"/><line x1="970" y1="520" x2="1080" y2="445"/><line x1="1035" y1="390" x2="1080" y2="445"/><line x1="1080" y1="445" x2="1125" y2="520"/><line x1="1000" y1="465" x2="1090" y2="465"/><line x1="1000" y1="465" x2="1040" y2="470"/><line x1="1090" y1="465" x2="1040" y2="470"/><circle cx="1035" cy="390" r="5" fill="#ff4f9e" stroke="none" filter="url(#neonPink)"/><circle cx="970" cy="520" r="5" fill="#41e9ef" stroke="none"/><circle cx="1125" cy="520" r="5" fill="#41e9ef" stroke="none"/><circle cx="1040" cy="470" r="5" fill="#ff4f9e" stroke="none"/></g>
  <g><ellipse cx="780" cy="590" rx="125" ry="48" fill="none" stroke="#41e7ec" stroke-width="2.2" stroke-dasharray="8 7"/><line x1="655" y1="590" x2="905" y2="590" class="faint"/><line x1="780" y1="542" x2="780" y2="638" class="faint"/><line x1="780" y1="590" x2="850" y2="560" stroke="#ff4f9e" stroke-width="2.5"/><circle cx="780" cy="590" r="5" fill="#41e7ec" filter="url(#neonCyan)"/><circle cx="850" cy="560" r="5" fill="#ff4f9e" filter="url(#neonPink)"/></g>
  <text x="930" y="575" class="formula">P(x, y, z)</text><text x="930" y="620" class="formula">d = |a⃗ − b⃗|</text><text x="560" y="670" class="formula">f(t) = at² + bt + c</text>
  <g fill="#79f2ef"><circle cx="470" cy="170" r="2.2"/><circle cx="505" cy="115" r="1.7"/><circle cx="570" cy="330" r="1.6"/><circle cx="620" cy="315" r="2.1"/><circle cx="760" cy="70" r="1.6"/><circle cx="905" cy="82" r="2.2"/><circle cx="975" cy="205" r="1.8"/><circle cx="1075" cy="300" r="2.1"/><circle cx="1115" cy="235" r="1.5"/><circle cx="965" cy="655" r="1.8"/></g>
  <path d="M490 300C420 390 460 545 610 620" fill="none" stroke="#45e4e9" stroke-opacity=".14" stroke-width="1.3"/><path d="M970 85C1110 175 1160 315 1110 445" fill="none" stroke="#ff4a9b" stroke-opacity=".12" stroke-width="1.3"/>
</svg>
